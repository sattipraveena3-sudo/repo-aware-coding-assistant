[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-aware-coding-assistant"
version = "1.0.0"
description = "Local-first AST-aware repository coding assistant with FastAPI, web UI, CLI, and optional Ollama synthesis"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pydantic==2.11.7"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1"]

[project.scripts]
repo-assistant = "code_assistant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
