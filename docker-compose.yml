services:
  assistant:
    build: .
    ports:
      - "8000:8000"
    environment:
      REPO_ASSISTANT_WORKSPACE: /data
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:3b
    volumes:
      - assistant-data:/data
      - ./:/workspace/example:ro
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  assistant-data:
  ollama-data:
